<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Animal para adoção</title>

<link rel="stylesheet" href="/mapapet-site/style.css">

</head>

<body>

<div class="container">

    <div class="card">

        <img id="petImage" src="https://placekitten.com/400/300" class="pet-image">

        <div class="content">

            <h1 id="petName">Animal para adoção</h1>

            <p id="petLocation">
                📍 Próximo de você
            </p>

            <p id="petDescription">
                Veja mais informações no aplicativo e ajude este animal a encontrar um lar ❤️
            </p>

            <div class="buttons">

                <button onclick="openApp()" class="btn primary">
                    Abrir no App
                </button>

                <button onclick="openStore()" class="btn secondary">
                    Instalar App
                </button>

            </div>

        </div>

    </div>

</div>

<script src="/mapapet-site/script.js"></script>

</body>
</html>
